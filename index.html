<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="grid-container">
        <div class="sidebar">
            <div class="icon">
                <img>
                <p>Dashboard</p>
            </div>
            <div class="sidebar1">
                <ul>
                    <li>Home</li>
                    <li>Profile</li>
                    <li>Messages</li>
                    <li>History</li>
                    <li>Tasks</li>
                    <li>Communities</li>
                </ul>
            </div>
            <div class="sidebar2">
                <ul>
                    <li>Settings</li>
                    <li>Support</li>
                    <li>Privacy</li>
                </ul>
            </div>
        </div>

        <div class="navbar">
            <div class="upper-row">
                <div class="searchbar">
                    <img>
                    <input type="search">
                </div>
                <div class="user">
                    <button>Bell</button>
                    <img>
                    <p>Chill Guy</p>
                </div>
            </div>
            <div class="lower-row"></div>
                <div class="user-tag">
                    <img>
                    <p>Hi there</p>
                </div>
                <div class="user-function">
                    <button>New</button>
                    <button>Button</button>
                    <button>Share</button>
                </div>
        </div>
        <div class="dashboard">
            <div class="main">
                <h1>Your Project</h1>
                <div class="projects"></div>
            </div>
            <div class="side">
                <div class="announcements">
                    <h1>Announcements</h1>
                </div>
                <div class="trending">
                    <h1>Trending</h1>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
